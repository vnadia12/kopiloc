<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coffee Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Coffee Map</h1>
    <input id="search" type="search" placeholder="Search by name or area" aria-label="Search coffee shops">
    <button id="nearBtn" type="button">Sort by nearest</button>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <label><input type="checkbox" id="fWifi"> Wifi</label>
    <label><input type="checkbox" id="fOutlet"> Power outlets</label>
    <label><input type="checkbox" id="fOpen"> Open now</label>
    <span id="count" class="count"></span>
  </div>

  <main class="layout">
    <aside id="list" class="list" aria-live="polite"></aside>
    <div id="map" class="map"></div>
  </main>

  <dialog id="detail" class="detail">
    <button id="closeDetail" class="close" type="button" aria-label="Close">&times;</button>
    <div id="detailBody"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data/shops.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
